[package]
name = "tauri-plugin-single-instance"
version = "2.5.4-plix.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Windows-only vendored Tauri single-instance plugin; see UPSTREAM.md"
publish = false

[dependencies]
tauri = { version = "2", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_DataExchange",
  "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging",
  "Win32_Security", "Win32_Security_Authorization", "Win32_Graphics_Gdi",
] }
