[package]
name = "ympleer-v2"
version = "0.1.0"
description = "PLIX"
edition = "2021"
default-run = "plix"

[[bin]]
name = "plix"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
windows = { version = "0.62.2", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
windows-future = "0.3.2"
windows-core = "0.62.2"
wasapi = "=0.26.0"
rustfft = "=6.4.1"

